name: Release

# タグ（v で始まるもの）を push すると、Windows で EXE をビルドして
# GitHub Release に添付する。Python が用意できない PC でも変換だけは
# できるようにするため。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # 手動でも回せるようにしておく

permissions:
  contents: write         # Release の作成と添付に必要

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      # 変換に要らないものを外す。指定しないと PyInstaller が
      # browser_factory の遅延 import まで静的に追いかけ、selenium と
      # playwright を丸ごと同梱して 80MB 近くまで膨らむ。
      - name: Build EXE
        run: .\build_exe.ps1
        shell: pwsh

      # 明細CSV は実行環境（C:\temp）にある前提で埋め込まれるため、
      # 検証用にランナー上へ置いておく。
      - name: Prepare details file
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\temp | Out-Null
          Copy-Item examples\pad\sample_batch.csv C:\temp\sample_batch.csv

      # ビルドした EXE が Python 版と同じものを出すか確かめる。
      # ここで差が出るなら配布してはいけない。
      - name: Verify EXE output matches Python
        shell: pwsh
        run: |
          $common = @(
            "--batch", "examples/pad/pad_sample_batch.json",
            "--details", "C:\temp\sample_batch.csv",
            "--id-column", "ID",
            "--driver-exe", "C:\temp\msedgedriver.exe",
            "--pad-out-dir", "C:\temp",
            "--pad-browser", "edge", "--auto-driver"
          )
          & dist\pad_webdriver_ref.exe @common --robin out_exe.robin.txt
          & python pad_webdriver_ref.py @common --robin out_py.robin.txt
          $diff = Compare-Object (Get-Content out_exe.robin.txt) (Get-Content out_py.robin.txt)
          if ($diff) {
            $diff | Format-Table | Out-String | Write-Host
            throw "EXE と Python 版の出力が一致しません"
          }
          Write-Host "出力の一致を確認しました"

      - name: Show SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\pad_webdriver_ref.exe -Algorithm SHA256).Hash
          "$h  pad_webdriver_ref.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/pad_webdriver_ref.exe
            SHA256SUMS.txt
          body: |
            ## pad_webdriver_ref.exe

            録画JSON を PAD の Robin コードへ変換する実行ファイル。
            **Python のインストールは不要**で、これ 1 つで動く。

            ```
            pad_webdriver_ref.exe --batch <録画JSON> ^
                --details "C:\temp\明細.csv" --id-column "<ID列名>" ^
                --robin <出力先.robin.txt> ^
                --driver-exe "C:\temp\msedgedriver.exe" ^
                --pad-out-dir "C:\temp" --pad-browser edge --auto-driver
            ```

            署名を付けていないため、初回は SmartScreen が警告を出す。
            `SHA256SUMS.txt` の値と `Get-FileHash` の結果を照合してから使うこと。

            使い方の詳細は [docs/PAD_WebDriver.md](docs/PAD_WebDriver.md)。

      - uses: actions/upload-artifact@v4
        with:
          name: pad_webdriver_ref-exe
          path: |
            dist/pad_webdriver_ref.exe
            SHA256SUMS.txt
