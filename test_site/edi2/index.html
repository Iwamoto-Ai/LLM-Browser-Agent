<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>練習 iSupplier Portal（Practice）</title>
<style>
  body { font-family: "Segoe UI", sans-serif; margin: 0; background: #fff; }
  /* ログイン画面（Oracle風の紺） */
  .login-bg { background: #1f4e6b; min-height: 100vh; padding-top: 60px; color: #fff; }
  .login-box { width: 360px; margin: 0 auto; background: rgba(255,255,255,.08);
               padding: 28px; border-radius: 6px; }
  .login-box label { display: block; margin: 10px 0 4px; }
  .login-box input { width: 100%; padding: 6px; box-sizing: border-box; }
  .login-note { width: 360px; margin: 16px auto; font-size: 12px; color: #cfe0ee; }
  /* 共通ヘッダー */
  .hdr { background: #1f4e6b; color: #fff; padding: 10px 16px; display: flex;
         align-items: center; gap: 18px; }
  .hdr .brand { font-weight: bold; }
  .hdr a { color: #fff; text-decoration: none; }
  .hdr .right { margin-left: auto; font-size: 12px; }
  .tabs { border-bottom: 1px solid #ccc; padding: 8px 16px; display: flex; gap: 18px; }
  .tabs a { color: #06c; text-decoration: none; cursor: pointer; }
  .crumb { padding: 6px 16px; font-size: 12px; color: #06c; }
  .main { padding: 12px 16px; }
  h2 { margin: 8px 0; }
  table.grid { border-collapse: collapse; margin-top: 8px; }
  table.grid th, table.grid td { border: 1px solid #b7cfe3; padding: 5px 8px; font-size: 13px; }
  table.grid th { background: #dfeaf4; }
  button { padding: 3px 14px; }
  .note { font-size: 12px; color: #777; margin-top: 14px; }
  a.polink { color: #06c; cursor: pointer; text-decoration: underline; }
  .textdiv { display: inline; }
  select { padding: 2px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* 練習用ダミーサイト（Oracle iSupplier Portal 風）。実在のシステム・データとは無関係。
   実 EBS の録画と同じ要素 ID（usernameField / POS_ORDERS / SrchBtn / Value_0 /
   PosHpgGenericUrl3c /
   ActionGoBtn / PosSubmitBtn / N58:PosPoNumber:0 …）を持たせ、
   発注確認（注文受諾）バッチの検証を実環境なしで行えるようにしている。
   画面ごとに #app を描画し直すことで、実サイトの「別ページ遷移」を模倣する。 */
var app = document.getElementById('app');
var currentPo = '';

function header(sub) {
  return '<div class="hdr">' +
    '<span class="brand">ORACLE (練習) ' + (sub || 'E-Business Suite') + '</span>' +
    '<a id="homeIcon">ホーム</a>' +
    '<span class="right">ログイン名 demo（練習）</span></div>';
}

/* ---------- 各画面 ---------- */
function viewLogin(msg) {
  app.innerHTML =
    '<div class="login-bg"><div class="login-box">' +
    '<label>ユーザー名</label><input id="usernameField" autocomplete="off">' +
    '<label>パスワード</label><input id="passwordField" type="password">' +
    '<p><button id="LoginBtn">ログイン</button> <button type="button">取消</button></p>' +
    '<p style="color:#ffd0d0">' + (msg || '') + '</p></div>' +
    '<div class="login-note">これは練習用ダミーサイトです（demo / password123）。' +
    '実在の企業・システム・データとは一切関係ありません。</div></div>';
  document.getElementById('LoginBtn').addEventListener('click', function () {
    var u = document.getElementById('usernameField').value;
    var p = document.getElementById('passwordField').value;
    if (u === 'demo' && p === 'password123') { viewEbsHome(); }
    else { viewLogin('ユーザー名またはパスワードが違います。'); }
  });
}

/* ログイン直後の画面。実サイトと同じく、ナビゲータのフォルダを開いてから
   「取引情報入力・照会」へ進む。 */
function viewEbsHome() {
  app.innerHTML = header('E-Business Suite') +
    '<div class="main"><h2>ホーム</h2>' +
    '<div style="border:1px solid #ddd;width:320px;padding:10px">' +
    '<b>ナビゲータ</b><br><br>' +
    '<a id="LI仕入先" class="polink"><div class="textdiv">📁 仕入先（練習）</div></a>' +
    '<div id="naviTree"></div>' +
    '</div></div>';
  bindHome();
  document.getElementById('LI仕入先').addEventListener('click', function () {
    document.getElementById('naviTree').innerHTML =
      '<div style="margin-left:16px">📄 納入一括登録（練習では未実装）<br>' +
      '<a id="LI取引情報入力・照会" class="polink">' +
      '<div class="textdiv">📁 取引情報入力・照会</div></a></div>';
    document.getElementById('LI取引情報入力・照会')
      .addEventListener('click', viewPosHpg);
  });
}

/* 取引情報入力・照会。ここから「ホームページ」で仕入先ホームへ入る。
   実サイトでも #PosHpgGenericUrl3c を 1 回押す必要がある。 */
function viewPosHpg() {
  app.innerHTML = header('E-Business Suite') +
    '<div class="crumb">取引情報入力・照会 &gt;</div>' +
    '<div class="main"><h2>取引情報入力・照会</h2>' +
    '<p><a class="polink" id="PosHpgGenericUrl3c">ホームページ</a></p>' +
    '<p class="note">「ホームページ」から仕入先ホーム（繰り返しの起点）へ進みます。</p></div>';
  bindHome();
  document.getElementById('PosHpgGenericUrl3c')
    .addEventListener('click', viewIspHome);
}

function viewIspHome() {
  app.innerHTML = header('iSupplier Portal') +
    '<div class="tabs"><a>仕入先ホーム</a><a id="POS_ORDERS">発注</a>' +
    '<a id="POS_SHIPMENTS">納入</a><a>財務</a><a>管理</a></div>' +
    '<div class="main"><h2>仕入先ホーム（練習）</h2>' +
    '<p>通知・発注一覧・納入一覧のダミー表示。上のタブ「発注」または「納入」から進みます。</p>' +
    '<p><a class="polink" id="LI帳票出力">帳票出力</a>（検収状況一覧）</p></div>';
  bindHome();
  document.getElementById('POS_ORDERS').addEventListener('click', viewHattyuTab);
  document.getElementById('POS_SHIPMENTS').addEventListener('click', viewNounyuTab);
  document.getElementById('LI帳票出力').addEventListener('click', viewKenshuJoken);
}

function viewHattyuTab() {
  app.innerHTML = header('iSupplier Portal') +
    '<div class="tabs"><a>仕入先ホーム</a><a><b>発注</b></a><a>納入</a><a>財務</a><a>管理</a></div>' +
    '<div class="tabs"><a id="POS_PURCHASE_ORDERS">発注</a><a>購買履歴</a></div>' +
    '<div class="main"><p>サブタブ「発注」をクリックして発注一覧へ。</p></div>';
  bindHome();
  document.getElementById('POS_PURCHASE_ORDERS').addEventListener('click', viewPoList);
}

/* 受理済みにした発注番号を覚えておく。実サイトと同じく、受理したあとに
   もう一度検索して開くとステータスが「受理済」に変わる。 */
var accepted = {};

function poStatus(po) { return accepted[po] ? '受理済' : '要確認'; }

function viewPoList() {
  app.innerHTML = header('iSupplier Portal') +
    '<div class="tabs"><a>仕入先ホーム</a><a><b>発注</b></a><a>納入</a><a>財務</a><a>管理</a></div>' +
    '<div class="main"><h2>発注</h2>' +
    '<p>表示 <select><option>全発注</option></select> <button>進む</button> ' +
    '<button id="SrchBtn">拡張検索</button></p>' +
    '<p class="note">練習では「拡張検索」から発注番号で検索します。</p></div>';
  bindHome();
  document.getElementById('SrchBtn').addEventListener('click', viewAdvSearch);
}

function viewAdvSearch() {
  app.innerHTML = header('iSupplier Portal') +
    '<div class="tabs"><a>仕入先ホーム</a><a><b>発注</b></a><a>納入</a><a>財務</a><a>管理</a></div>' +
    '<div class="main"><h2>発注 — 拡張検索</h2>' +
    '<p>発注番号 <select><option>等しい</option></select> ' +
    '<input id="Value_0" size="16" autocomplete="off"> ' +
    '<button id="AdvGoBtn">進む</button></p>' +
    '<div id="results"><p class="note">検索するには発注番号を入力して「進む」。</p></div></div>';
  bindHome();
  document.getElementById('AdvGoBtn').addEventListener('click', function () {
    var po = document.getElementById('Value_0').value.trim();
    var r = document.getElementById('results');
    if (!po) { r.innerHTML = '<p>検索基準を少なくとも 1 つ入力してください。</p>'; return; }
    r.innerHTML = '<table class="grid"><tr><th>選択</th><th>発注番号</th><th>件名</th>' +
      '<th>発注日</th><th>金額</th><th>通貨</th><th>ステータス</th></tr>' +
      '<tr><td><input type="radio"></td>' +
      '<td><a class="polink" id="N58:PosPoNumber:0">' + po + '</a></td>' +
      '<td>更新／練習サンプル株式会社／Ａ００３２２１８０９－Ｊ５００</td>' +
      '<td>2026/07/06 12:34:05</td><td>16,600</td><td>JPY</td>' +
      '<td>' + poStatus(po) + '</td></tr></table>';
    document.getElementById('N58:PosPoNumber:0').addEventListener('click', function () {
      currentPo = po; viewPoDetail();
    });
  });
}

/* 発注情報の画面。受理したあとにここを開くとステータスが「受理済」になる。
   注文受諾のエビデンスは、この画面を撮る。 */
function viewPoDetail() {
  app.innerHTML = header('iSupplier Portal') +
    '<div class="crumb">発注: 発注 &gt;</div>' +
    '<div class="main"><h2>標準発注: ' + currentPo + ', 0 (合計 JPY 16,600)</h2>' +
    '<p>通貨= JPY</p>' +
    '<p>処理 <select><option>確認</option></select> ' +
    '<button id="ActionGoBtn">進む</button> <button>エクスポート</button></p>' +
    '<h3>発注情報</h3>' +
    '<table class="grid">' +
    '<tr><th>合計</th><td>16,600</td></tr>' +
    '<tr><th>仕入先</th><td>練習サンプル株式会社</td></tr>' +
    '<tr><th>購買担当</th><td>- - / 法人発注代行 A</td></tr>' +
    '<tr><th>発注日</th><td>2026/07/06 12:34:05</td></tr>' +
    '<tr><th>件名</th><td>更新／練習サンプル株式会社／Ａ００３２２１８０９－Ｊ５００</td></tr>' +
    '<tr><th>ステータス</th><td id="poStatus">' + poStatus(currentPo) + '</td></tr>' +
    '<tr><th>支払条件</th><td>検収翌々月15日支払</td></tr>' +
    '</table></div>';
  bindHome();
  document.getElementById('ActionGoBtn').addEventListener('click', viewPoConfirm);
}

function viewPoConfirm() {
  app.innerHTML = header('iSupplier Portal') +
    '<div class="crumb">発注: 発注 &gt; オーダー詳細の表示 &gt;</div>' +
    '<div class="main"><h2>確認 標準発注 : ' + currentPo + ',0 (合計 JPY 16,600)</h2>' +
    '<p><button>取消</button> <button>エクスポート</button> 処理 ' +
    '<select><option>発注全体の受理</option></select> ' +
    '<button id="ActionGoBtn">進む</button></p></div>';
  bindHome();
  document.getElementById('ActionGoBtn').addEventListener('click', viewPoNotify);
}

function viewPoNotify() {
  app.innerHTML = header('iSupplier Portal') +
    '<div class="crumb">発注: 発注 &gt; オーダー詳細の表示 &gt; 確認 標準発注 &gt;</div>' +
    '<div class="main"><h2>通知発注 ' + currentPo + '</h2>' +
    '<table class="grid"><tr><th>金額</th><td>16,600</td></tr>' +
    '<tr><th>処理</th><td>受理</td></tr></table>' +
    '<p><button>取消</button> <button id="PosSubmitBtn">発行</button></p></div>';
  bindHome();
  document.getElementById('PosSubmitBtn').addEventListener('click', function () {
    accepted[currentPo] = true;
    viewPoDone();
  });
}

function viewPoDone() {
  app.innerHTML = header('iSupplier Portal') +
    '<div class="crumb">発注: 発注 &gt; オーダー詳細の表示 &gt; 確認 標準発注 &gt;</div>' +
    '<div class="main"><h2>発注確認</h2>' +
    '<p>発注 ' + currentPo + ' は確認されました。</p>' +
    '<p><a class="polink" id="backToList">発注要約に戻る</a></p></div>';
  bindHome();
  document.getElementById('backToList').addEventListener('click', viewPoList);
}


/* ============================================================
   納入登録（フロー2の練習）
   実サイトの流れ:
     納入タブ → 納入登録 → 拡張検索 → 発注番号 → 進む
     → 検索結果を選択 → 納入に追加 → 納入ヘッダー
     → 納入番号・納入日を入力 → 発行確認 → 発行 → 完了
   ============================================================ */
var shipNo = '';          /* 入力された納入番号 */
var shipDate = '';        /* 入力された納入日 */
var shipPo = '';          /* 対象の発注番号 */
var registered = {};      /* 納入登録済みの発注番号 */

function viewNounyuTab() {
  app.innerHTML = header('iSupplier Portal') +
    '<div class="tabs"><a>仕入先ホーム</a><a>発注</a><a><b>納入</b></a><a>財務</a><a>管理</a></div>' +
    '<div class="tabs"><a id="POS_DELIVERY">納入</a><a>納入予定</a><a>納期遅延受入</a></div>' +
    '<div class="main"><p>サブタブ「納入」から納入登録へ進みます。</p></div>';
  bindHome();
  document.getElementById('POS_DELIVERY').addEventListener('click', viewNounyuMenu);
}

function viewNounyuMenu() {
  app.innerHTML = header('iSupplier Portal') +
    '<div class="tabs"><a>仕入先ホーム</a><a>発注</a><a><b>納入</b></a><a>財務</a><a>管理</a></div>' +
    '<div class="tabs"><a><b>納入</b></a><a>納入予定</a><a>納期遅延受入</a></div>' +
    '<div class="main"><h2>納入</h2>' +
    '<p><a class="polink" id="PosShipCreate">納入登録</a></p>' +
    '<p class="note">練習では「納入登録」から発注番号を検索して登録します。</p></div>';
  bindHome();
  document.getElementById('PosShipCreate')
    .addEventListener('click', viewNounyuSearch);
}

function viewNounyuSearch() {
  app.innerHTML = header('iSupplier Portal') +
    '<div class="crumb">納入: 納入登録 &gt;</div>' +
    '<div class="main"><h2>納入登録</h2>' +
    '<p><button id="ShipSrchBtn">拡張検索</button></p>' +
    '<div id="shipResults"><p class="note">「拡張検索」から発注番号で検索します。</p></div></div>';
  bindHome();
  document.getElementById('ShipSrchBtn').addEventListener('click', viewNounyuAdv);
}

function viewNounyuAdv() {
  app.innerHTML = header('iSupplier Portal') +
    '<div class="crumb">納入: 納入登録 &gt;</div>' +
    '<div class="main"><h2>納入登録 — 拡張検索</h2>' +
    '<p>発注番号 <select><option>等しい</option></select> ' +
    '<input id="ShipPoField" size="16" autocomplete="off"> ' +
    '<button id="ShipGoBtn">進む</button></p>' +
    '<div id="shipResults"><p class="note">発注番号を入力して「進む」。</p></div></div>';
  bindHome();
  document.getElementById('ShipGoBtn').addEventListener('click', function () {
    var po = document.getElementById('ShipPoField').value.trim();
    var r = document.getElementById('shipResults');
    if (!po) { r.innerHTML = '<p>検索基準を少なくとも 1 つ入力してください。</p>'; return; }
    shipPo = po;
    r.innerHTML = '<table class="grid"><tr><th>選択</th><th>発注番号</th><th>明細</th>' +
      '<th>品名</th><th>数量</th><th>単位</th></tr>' +
      '<tr><td><input type="checkbox" id="M__Idb"></td><td>' + po + '</td><td>1</td>' +
      '<td>練習サンプル品</td><td>1</td><td>式</td></tr></table>' +
      '<p><button id="AddToShipBtn">納入に追加</button></p>';
    document.getElementById('AddToShipBtn')
      .addEventListener('click', viewNounyuMeisai);
  });
}

function viewNounyuMeisai() {
  app.innerHTML = header('iSupplier Portal') +
    '<div class="crumb">納入: 納入登録 &gt; 納入明細 &gt;</div>' +
    '<div class="main"><h2>納入明細</h2>' +
    '<table class="grid"><tr><th>発注番号</th><th>品名</th><th>数量</th></tr>' +
    '<tr><td>' + shipPo + '</td><td>練習サンプル品</td><td>1</td></tr></table>' +
    '<p><button id="ShipHeaderBtn">納入ヘッダー</button></p></div>';
  bindHome();
  document.getElementById('ShipHeaderBtn')
    .addEventListener('click', viewNounyuHeader);
}

function viewNounyuHeader() {
  app.innerHTML = header('iSupplier Portal') +
    '<div class="crumb">納入: 納入登録 &gt; 納入明細 &gt; 納入ヘッダー &gt;</div>' +
    '<div class="main"><h2>納入ヘッダー</h2>' +
    '<p>納入番号 <input id="ShipNumField" size="20" autocomplete="off"></p>' +
    '<p>納入日 <input id="ShipDateField" size="20" autocomplete="off"></p>' +
    '<p><button id="ShipConfirmBtn">発行確認</button></p>' +
    '<p class="note">納入番号にはプロジェクト番号を入れます。</p></div>';
  bindHome();
  document.getElementById('ShipConfirmBtn').addEventListener('click', function () {
    shipNo = document.getElementById('ShipNumField').value.trim();
    shipDate = document.getElementById('ShipDateField').value.trim();
    viewNounyuConfirm();
  });
}

function viewNounyuConfirm() {
  app.innerHTML = header('iSupplier Portal') +
    '<div class="crumb">納入: 納入登録 &gt; 納入明細 &gt; 納入ヘッダー &gt;</div>' +
    '<div class="main"><h2>納入登録の確認</h2>' +
    '<table class="grid"><tr><th>発注番号</th><td>' + shipPo + '</td></tr>' +
    '<tr><th>納入番号</th><td>' + shipNo + '</td></tr>' +
    '<tr><th>納入日</th><td>' + shipDate + '</td></tr></table>' +
    '<p><button>取消</button> <button id="ShipSubmitBtn">発行</button></p></div>';
  bindHome();
  document.getElementById('ShipSubmitBtn').addEventListener('click', function () {
    registered[shipPo] = shipNo;
    viewNounyuDone();
  });
}

function viewNounyuDone() {
  app.innerHTML = header('iSupplier Portal') +
    '<div class="crumb">納入: 納入登録 &gt;</div>' +
    '<div class="main"><h2>納入登録完了</h2>' +
    '<p>納入番号 <b>' + shipNo + '</b> で登録しました。</p>' +
    '<p class="note">エビデンスは「検収状況一覧」（EBS ホーム → 帳票出力）から取得します。</p></div>';
  bindHome();
}

/* ============================================================
   検収状況一覧（フロー3の練習・ファイルのダウンロードまで）
   実サイトの流れ:
     帳票出力 → 検収状況一覧 → 条件入力 → 続行 → 発行
     → 要求IDがポップアップで出る → OK
     → 要求一覧で出力アイコン → Excel がダウンロードされる
   実サイトでは発行から出力まで 1〜5 時間かかるが、練習ではすぐ落とせる。
   ============================================================ */
var requestId = '';

  app.innerHTML = header('E-Business Suite') +

    '<p class="note">「出力」を押すと Excel がダウンロードされます。</p></div>';
  bindHome();
  document.getElementById('OutputIcon0').addEventListener('click', downloadReport);
}

/* base64 の xlsx を Blob にしてダウンロードさせる。実サイトでサーバーが
   Content-Disposition で返すのと同じく、ブラウザーの保存先に落ちる。 */
function downloadReport() {
  var bin = atob(XLSX_B64);
  var arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) { arr[i] = bin.charCodeAt(i); }
  var mime = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  var url = URL.createObjectURL(new Blob([arr], { type: mime }));
  var a = document.createElement('a');
  a.href = url;
  a.download = 'XXPO_検収状況一覧_' + requestId + '.xlsx';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
}

function bindHome() {
  var h = document.getElementById('homeIcon');
  if (h) { h.addEventListener('click', viewEbsHome); }
}
